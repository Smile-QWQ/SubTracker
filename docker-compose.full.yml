services:
  api:
    image: ${SUBTRACKER_API_IMAGE:-ghcr.io/smile-qwq/subtracker-api:latest}
    container_name: subtracker-api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/subtracker.db}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://subtracker.example.com}
      BASE_CURRENCY: ${BASE_CURRENCY:-CNY}
      CRON_SCAN: "${CRON_SCAN:-* * * * *}"
      CRON_REFRESH_RATES: "${CRON_REFRESH_RATES:-0 2 * * *}"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      BACKUP_MAX_ARCHIVE_MIB: ${BACKUP_MAX_ARCHIVE_MIB:-2048}
      BACKUP_MAX_EXPANDED_MIB: ${BACKUP_MAX_EXPANDED_MIB:-2048}
      BACKUP_TEMP_MAX_MIB: ${BACKUP_TEMP_MAX_MIB:-}
      DEFAULT_APP_LOCALE: ${DEFAULT_APP_LOCALE:-zh-CN}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ./data/logos:/app/apps/api/storage/logos

  web:
    image: ${SUBTRACKER_WEB_IMAGE:-ghcr.io/smile-qwq/subtracker-web:latest}
    container_name: subtracker-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
