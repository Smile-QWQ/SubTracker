server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON uploads use base64, so allow room above the 20 MiB image limit.
    location /api/ {
        client_max_body_size 30m;
        proxy_read_timeout 120s;
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/import/subtracker/inspect {
        # The API enforces the configurable archive limit while writing to private disk.
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
        proxy_pass http://api:3001/api/v1/import/subtracker/inspect;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/import/subtracker/commit {
        client_max_body_size 1m;
        proxy_read_timeout 1800s;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/settings/export/backup {
        # One-use download capabilities must not appear in proxy access logs.
        access_log off;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        send_timeout 300s;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/logos/ {
        proxy_pass http://api:3001/static/logos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
